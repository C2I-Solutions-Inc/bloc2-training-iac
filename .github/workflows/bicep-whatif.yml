name: Bicep what-if

# Reusable stage called by deploy-bicep.yml: previews a deployment with
# `az deployment group what-if` and posts the result to the run summary.
# Read-only; never deploys. Called once per environment so dev and prod
# previews can run in parallel.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and parameter file name (bicep/vars/<environment>.bicepparam)
        type: string
        required: true
      resource-group:
        description: Existing resource group to preview
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TEMPLATE_FILE: environments.json
  PARAMETERS_FILE: ${{ inputs.environment }}.parameters.json
  RESOURCE_GROUP: ${{ inputs.resource-group }}
  ENVIRONMENT: ${{ inputs.environment }}
  LOCATION: canadaeast

jobs:
  what-if:
    name: What-if
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          if [[ -z "$RESOURCE_GROUP" ]]; then
            echo "::error::Resource group variable for '$ENVIRONMENT' is not set. See README.md."
            exit 1
          fi

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bicep

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --location "$LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE" \
            --parameters resourceGroupName="$RESOURCE_GROUP" location="$LOCATION" \
            | tee "$RUNNER_TEMP/what-if.txt"
          {
            echo "### Bicep what-if: $ENVIRONMENT (\`$RESOURCE_GROUP\`)"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/what-if.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
