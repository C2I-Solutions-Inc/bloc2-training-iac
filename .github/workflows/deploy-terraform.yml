name: Deploy Terraform

# Validate once, then plan dev and prod in parallel, then promote the same
# artifact through dev and prod applies. Dev apply waits for both plans so
# reviewers see the full picture before approving; prod apply only starts
# after dev has applied. Configuration lives in GitHub variables and one
# secret; see README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac-demo/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - uses: actions/upload-artifact@v4
        with:
          name: terraform
          path: |
            iac-demo/terraform
            !iac-demo/terraform/.terraform
          include-hidden-files: true
          if-no-files-found: error

  plan-dev:
    name: Plan (dev)
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: dev
      resource-group: ${{ vars.DEV_RESOURCE_GROUP }}
    secrets: inherit

  plan-prod:
    name: Plan (prod)
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: prod
      resource-group: ${{ vars.PROD_RESOURCE_GROUP }}
    secrets: inherit

  apply-dev:
    name: Apply (dev)
    needs: [plan-dev, plan-prod]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: dev
      resource-group: ${{ vars.DEV_RESOURCE_GROUP }}
    secrets: inherit

  apply-prod:
    name: Apply (prod)
    needs: apply-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: prod
      resource-group: ${{ vars.PROD_RESOURCE_GROUP }}
    secrets: inherit
