name: Bicep deploy

# Reusable stage called by deploy-bicep.yml: deploys to a given environment.
# Gated by that environment's required-reviewer approval (GitHub environment
# protection rules).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and parameter file name (bicep/vars/<environment>.bicepparam)
        type: string
        required: true
      resource-group:
        description: Existing resource group to deploy into
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TEMPLATE_FILE: environments.json
  PARAMETERS_FILE: ${{ inputs.environment }}.parameters.json
  RESOURCE_GROUP: ${{ inputs.resource-group }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check configuration
        run: |
          if [[ -z "$RESOURCE_GROUP" ]]; then
            echo "::error::Resource group variable for '$ENVIRONMENT' is not set. See README.md."
            exit 1
          fi

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bicep

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "environments-$ENVIRONMENT-$GITHUB_RUN_NUMBER" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE" \
            --query properties.outputs --output json \
            | tee "$RUNNER_TEMP/outputs.json"
          {
            echo "### Bicep deployment outputs: $ENVIRONMENT"
            echo '```json'
            cat "$RUNNER_TEMP/outputs.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
